llm:
  provider: openrouter       # anthropic (default) | openrouter
  model:                     # optional; per-provider default when unset

thresholds:
  hn_points: 50

synthesis:
  enabled: true
  min_score: 6
  max_chars: 8000

search:
  interval_hours: 6
  max_results_per_query: 10
  max_queries: 10
  dynamic_queries_enabled: true
  fixed_queries:
    - "LLM prompting techniques 2026"
    - "agentic AI patterns"
    - "multimodal language models"
    - "LLM inference optimization"
    - "AI agent frameworks"

schedule:
  daily_sweep: "08:00"
  weekly_deep: "sunday 08:00"

sources:
  # Change 0010: config-gated article sources on the 0009 adapter layer.
  # Each is fail-soft — an adapter error skips that source, never aborts the sweep.
  hf_papers:
    enabled: true       # Hugging Face daily papers (curated, high signal)
    min_upvotes: 0      # 0 = curation is the filter; raise to require upvotes
  arxiv_queries:        # keyword searches alongside the cs.AI/cs.CL/cs.LG firehose
    - "LLM agents"
    - "prompt optimization"
    - "retrieval augmented generation"
  github_trending:
    enabled: true
    topics: [llm, ai-agents, rag]
    min_stars: 100      # engagement threshold; GITHUB_TOKEN honored from env if set
  semantic_scholar:     # Change 0012: Semantic Scholar Graph API keyword search
    enabled: true       # cross-venue papers with abstracts, tldr, citation counts
    max_per_query: 10   # per-query result cap
  # s2_queries defaults to arxiv_queries above when unset; uncomment to override:
  # s2_queries:
  #   - "LLM agents"
  bluesky:              # Change 0013: curated AI-researcher author feeds
    enabled: true       # public getAuthorFeed, no auth; posts as candidate items
    min_engagement: 5   # likes+reposts floor; posts below are noise-prone
    authors:            # human-curated registry of active AI researchers
      - simonwillison.net
      - karpathy.bsky.social
      - soumith.bsky.social
      - emollick.bsky.social
      - jeremyphoward.bsky.social
      - rasbt.bsky.social
      - giffmana.ai
      - natolambert.bsky.social
      - tomgoldstein.bsky.social
      - jbhuang0604.bsky.social
      - sedielem.bsky.social
      - chelseafinn.bsky.social
      - merve.bsky.social
      - andrewwhite.bsky.social
      - gm8xx8.bsky.social
      - hardmaru.bsky.social
      - tunguz.bsky.social
      - osanseviero.bsky.social
      - danielvanstrien.bsky.social
      - arankomatsuzaki.bsky.social
      - johnowhitaker.bsky.social
      - lateinteraction.bsky.social
      - neelnanda.bsky.social
      - jxmnop.bsky.social
      - srush.bsky.social
      - yoavgo.bsky.social
      - vikhyat.bsky.social
  hf_trending:          # Change 0016: trending HF models + datasets (release-type artifacts)
    enabled: true       # no auth; top-N by trendingScore across models + datasets
    limit: 20           # per-endpoint top-N (models and datasets each)
    min_likes: 10       # likes floor (engagement); below is noise-prone
  feeds:
    - name: "Simon Willison's blog"
      url: "https://simonwillison.net/atom/everything/"
      type: blog
    - name: "Anthropic blog"
      url: "https://www.anthropic.com/news/rss.xml"
      type: blog
    - name: "OpenAI blog"
      url: "https://openai.com/blog/rss.xml"
      type: blog
    - name: "Hugging Face blog"
      url: "https://huggingface.co/blog/feed.xml"
      type: blog
    - name: "Lilian Weng's blog"
      url: "https://lilianweng.github.io/index.xml"
      type: blog
    - name: "The Gradient"
      url: "https://thegradient.pub/rss/"
      type: blog
    - name: "Google DeepMind blog"
      url: "https://deepmind.google/blog/rss.xml"
      type: blog
    - name: "Interconnects (Nathan Lambert)"
      url: "https://www.interconnects.ai/feed"
      type: newsletter
    # Change 0011: six externally-verified curated feeds (2026-08-07).
    - name: "AlphaSignal"
      url: "https://alphasignal.ai/feed.xml"
      type: newsletter
    - name: "TLDR AI"
      url: "https://tldr.tech/api/rss/ai"
      type: newsletter
    - name: "Latent Space"
      url: "https://www.latent.space/feed"
      type: newsletter
    - name: "Ahead of AI (Sebastian Raschka)"
